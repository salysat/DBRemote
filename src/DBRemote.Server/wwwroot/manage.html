<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DB Remote | إدارة الفروع</title><style>
*{box-sizing:border-box}body{font:15px 'Segoe UI',Tahoma,sans-serif;background:#f5f8fc;color:#183651;margin:0}.wrap{max-width:1150px;margin:auto;padding:26px}header{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}h1{font-size:25px;margin:0}a{color:#1679ac;text-decoration:none}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:24px}.card{background:#fff;border:1px solid #dfe9f3;border-radius:18px;padding:22px;box-shadow:0 8px 24px #122f4909}h2{margin:0 0 16px;font-size:18px}input,select{padding:11px;border:1px solid #d0e0ec;border-radius:10px;background:#fff;width:100%;margin:5px 0 10px}button{padding:10px 17px;border:0;border-radius:10px;background:#217fb7;color:white;cursor:pointer;margin:3px}button.secondary{background:#e9f3fa;color:#174771}ul{padding-right:18px;line-height:2.3}table{border-collapse:collapse;width:100%}td,th{border-bottom:1px solid #e2eaf2;padding:11px;text-align:right;word-break:break-word}small{color:#678096}#msg{margin:15px 0;color:#116d55}@media(max-width:750px){.grid{grid-template-columns:1fr}.wrap{padding:14px}h1{font-size:21px}}</style></head><body><main class="wrap"><header><div><h1>إدارة الفروع والهوية والسجل</h1><small>DB Remote · إدارة الأجهزة المعتمدة فقط</small></div><a href="/">الرجوع للأجهزة ←</a></header><p id="msg" role="status"></p><section class="grid"><article class="card"><h2>مجموعات الفروع</h2><label>مجموعة جديدة<input id="groupInput" maxlength="48" placeholder="مثال: فرع الدمام"></label><button id="addGroup">إضافة مجموعة</button><ul id="groups"></ul></article><article class="card"><h2>توزيع الأجهزة على الفروع</h2><label>الجهاز<select id="device"></select></label><label>المجموعة<select id="group"></select></label><button id="assign">حفظ المجموعة</button></article><article class="card"><h2>الهوية التجارية</h2><label>اسم اللوحة<input id="brand" maxlength="60"></label><label>لون الهوية<input id="accent" type="color"></label><button id="saveBrand">حفظ الهوية</button><p><small>يتم حفظ الاسم واللون على السيرفر. هذه التفضيلات لا تغيّر شعار Agent أو نظام Windows.</small></p></article><article class="card"><h2>سجل جلسات الاتصال</h2><button id="refreshHistory" class="secondary">تحديث</button><button id="exportHistory" class="secondary">تصدير CSV</button><table><thead><tr><th>الوقت</th><th>الجهاز</th><th>الحدث</th></tr></thead><tbody id="history"></tbody></table></article></section></main><script src="/manage.js"></script></body></html>
